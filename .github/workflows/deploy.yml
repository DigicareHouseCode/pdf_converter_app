name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys touch the server at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Cheap guard: a syntax error should fail here, not on the live server.
      - name: Byte-compile sources
        run: python -m compileall -q . -x '^\./(venv|\.git)/'

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    # GITHUB_TOKEN is forwarded to the server so it can fetch this private
    # repo. It expires when the job ends, so nothing durable is stored there.
    permissions:
      contents: read
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/pdf_converter_app' }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME || 'pdf_app' }}
      VENV_PATH: ${{ vars.VENV_PATH || '/var/www/pdf_converter_app/venv' }}
      HEALTH_URL: ${{ vars.HEALTH_URL }}
      SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then
            # Pinned host key - protects against MITM.
            printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            # Trust-on-first-use fallback. Set VPS_KNOWN_HOSTS to harden this.
            ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and restart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Config goes in over stdin rather than argv, so the token never
          # shows up in the server's process list.
          {
            echo "export DEPLOY_PATH='$DEPLOY_PATH'"
            echo "export SERVICE_NAME='$SERVICE_NAME'"
            echo "export VENV_PATH='$VENV_PATH'"
            echo "export REPO='$REPO'"
            echo "export SHA='$SHA'"
            echo "export GH_TOKEN='$GH_TOKEN'"
            cat <<'REMOTE'
          cd "$DEPLOY_PATH"

          # .env is gitignored and lives only on the server. If it vanished,
          # the app would boot with no DB credentials - stop before restarting.
          if [ ! -f .env ]; then
            echo "ERROR: $DEPLOY_PATH/.env is missing. Aborting."
            exit 1
          fi

          git config --global --add safe.directory "$DEPLOY_PATH" 2>/dev/null || true

          # First deploy: adopt the existing directory as a working tree.
          if [ ! -d .git ]; then
            echo "==> First deploy: initializing git repo in $DEPLOY_PATH"
            echo "==> Tracked files will be replaced by the repo's versions."
            echo "==> .env, uploads/, outputs/, instance/ are gitignored and stay as they are."
            git init -q -b main
            git remote add origin "https://github.com/$REPO.git"
          fi

          # Credentials are passed inline per fetch, so none are written to
          # .git/config or any credential store on the server.
          git fetch -q --prune \
            "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" \
            "+refs/heads/main:refs/remotes/origin/main"

          if git rev-parse --verify -q HEAD >/dev/null; then
            PREVIOUS=$(git rev-parse HEAD)
            echo "==> Currently deployed: $(git rev-parse --short HEAD)"
          else
            PREVIOUS=""
            echo "==> Currently deployed: (none, this is the first deploy)"
          fi

          git reset -q --hard "$SHA"
          echo "==> Now deploying:      $(git rev-parse --short HEAD)"

          "$VENV_PATH/bin/pip" install --quiet --disable-pip-version-check -r requirements.txt

          supervisorctl restart "$SERVICE_NAME"

          # Check twice with a gap. autorestart=true means a crash-looping app
          # can read as RUNNING for a moment before dying again.
          healthy=1
          for _ in 1 2; do
            sleep 5
            if ! supervisorctl status "$SERVICE_NAME" | grep -q RUNNING; then
              healthy=0
              break
            fi
          done

          if [ "$healthy" -eq 0 ]; then
            echo "==> Service is not running after restart."
            supervisorctl status "$SERVICE_NAME" || true
            supervisorctl tail -2000 "$SERVICE_NAME" stderr || true
            if [ -n "$PREVIOUS" ]; then
              echo "==> Rolling back to $PREVIOUS"
              git reset -q --hard "$PREVIOUS"
              "$VENV_PATH/bin/pip" install --quiet --disable-pip-version-check -r requirements.txt
              supervisorctl restart "$SERVICE_NAME"
              echo "==> Rolled back."
            else
              echo "==> No previous commit to roll back to; leaving as is."
            fi
            exit 1
          fi

          echo "==> Service is running."
          supervisorctl status "$SERVICE_NAME"
          REMOTE
          } | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
                "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
                'bash -euo pipefail -s'

      - name: Health check
        if: env.HEALTH_URL != ''
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$HEALTH_URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Health check passed (HTTP $code)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code - retrying in 5s"
            sleep 5
          done
          echo "Health check failed. The service is running but not serving 200."
          exit 1

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
