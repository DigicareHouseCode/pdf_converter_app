<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing PDF - PDF Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05), 0 10px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            text-align: center;
        }
        
        h1 {
            color: #111827;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
        }
        
        .progress-container {
            margin: 2rem 0;
        }
        
        .progress-bar-bg {
            background-color: #e5e7eb;
            border-radius: 9999px;
            height: 1rem;
            overflow: hidden;
            position: relative;
        }
        
        .progress-bar {
            background: linear-gradient(90deg, #3498db 0%, #3b82f6 100%);
            border-radius: 9999px;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .status-text {
            color: #4b5563;
            font-size: 0.95rem;
            margin-top: 1rem;
            min-height: 1.5rem;
        }
        
        .percentage {
            color: #111827;
            font-weight: 600;
            font-size: 1.25rem;
            margin-top: 0.5rem;
            display: block;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #3498db;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem auto;
        }

        .spinner-container {
             margin-bottom: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .wait-message {
            font-size: 0.85rem;
            color: #6b7280;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner-container">
            <div class="spinner"></div>
        </div>
        <h1>Processing Your Method</h1>
        
        <div class="progress-container">
            <div class="progress-bar-bg">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <span class="percentage" id="percentage">0%</span>
            <div class="status-text" id="statusText">Initializing...</div>
        </div>
        
        <p class="wait-message" id="waitMessage">
            This might take a few moments depending on the file size.
        </p>
    </div>

    <script>
        const taskId = "{{ task_id }}";
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');
        const percentage = document.getElementById('percentage');
        
        // Polling function
        function checkProgress() {
            fetch(`/progress/${taskId}`)
                .then(response => response.json())
                .then(data => {
                    // Update UI
                    const progress = Math.round(data.progress);
                    progressBar.style.width = `${progress}%`;
                    percentage.textContent = `${progress}%`;
                    statusText.textContent = data.message;
                    
                    if (data.status === 'completed') {
                        statusText.textContent = 'Complete! Redirecting...';
                        setTimeout(() => {
                            window.location.href = `/result/${taskId}`;
                        }, 500);
                    } else if (data.status === 'failed') {
                        statusText.textContent = `Error: ${data.message}`;
                        progressBar.style.backgroundColor = '#ef4444';
                        // Keep on page to show error
                    } else {
                        // Continue polling
                        setTimeout(checkProgress, 1000);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    statusText.textContent = 'Connection error. Retrying...';
                    setTimeout(checkProgress, 2000);
                });
        }
        
        // Start polling
        checkProgress();
    </script>
</body>
</html>
